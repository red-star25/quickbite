apiVersion: v1
kind: Namespace
metadata:
  name: quickbite
---
# ---------------------------
# Orders DB (Postgres)
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: quickbite
spec:
  selector:
    app: orders-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: quickbite
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: orders
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d orders"]
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: ordersdbdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: ordersdbdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# ---------------------------
# Inventory DB (Postgres)
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  namespace: quickbite
spec:
  selector:
    app: inventory-db
  ports:
    - name: postgres
